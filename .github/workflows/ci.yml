# ClaimGuard AI CI. Runs on every pull request and on every push to main.
# It never needs a secret: the live model is not called, so the AI step uses the deterministic template.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (syntax and install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true
          activate-environment: true
      - name: Install pinned dependencies
        run: uv pip install -r requirements.txt
      - name: Every Python file compiles
        run: python -m compileall -q src scripts tests
      - name: The rule pack compiles and the JSON files parse
        run: |
          python - <<'EOF'
          import json, pathlib
          import yara_x
          yara_x.compile(pathlib.Path('rules/core.yar').read_text(encoding='utf-8'))
          for p in [*pathlib.Path('rules').glob('*.json'), *pathlib.Path('schemas').glob('*.json')]:
              json.loads(p.read_text(encoding='utf-8'))
          print('rule pack and json files OK')
          EOF

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real MongoDB for the user-store contract tests. The password is derived from the run id (no literal credential in the repository) and belongs to this throwaway container only.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Redis is only the Celery broker of the work queue (src/workqueue); MongoDB above is the source of truth.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          activate-environment: true
      - name: Install pinned dependencies
        run: uv pip install -r requirements-dev.txt
      - name: Full test suite (no API key; MongoDB and Redis tests must run, not skip)
        env:
          FEATHERLESS_API_KEY: ''
          MONGO_URI: mongodb://ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:27017/?authSource=admin
          REQUIRE_MONGO: '1'
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_REDIS: '1'
        run: python -m unittest discover -s tests
      - name: The narrated demo runs end to end
        run: python scripts/demo.py --out-dir "$RUNNER_TEMP/demo"

  rules-accuracy:
    name: rules-accuracy (15 rules vs the answer key)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true
          activate-environment: true
      - name: Install pinned dependencies
        run: uv pip install -r requirements.txt
      - name: Run the rules on all three public splits and require a perfect score
        run: |
          set -e
          for split in development validation stress; do
            python src/run_yara.py --input data/$split/claims.jsonl --output "$RUNNER_TEMP/$split.pred.jsonl"
            python src/evaluate.py --gold data/$split/expected_results.jsonl --pred "$RUNNER_TEMP/$split.pred.jsonl" \
              --claims data/$split/claims.jsonl --output "$RUNNER_TEMP/$split.metrics.json"
            python - "$split" "$RUNNER_TEMP/$split.metrics.json" <<'EOF'
          import json, sys
          split, path = sys.argv[1:3]
          o = json.load(open(path))['overall']
          bad = {k: o[k] for k in ('status_accuracy', 'issue_precision', 'issue_recall') if o[k] != 1.0}
          bad.update({k: o[k] for k in ('false_abstentions', 'missed_abstentions', 'not_implemented') if o[k] != 0})
          print(split, 'count', o['count'], 'status_accuracy', o['status_accuracy'])
          sys.exit(f'{split}: regression {bad}' if bad else 0)
          EOF
          done
      - name: The committed audit sample still verifies (chain, anchor, AI ordering)
        run: python scripts/verify_audit.py --log outputs/audit_demo/audit.jsonl

  security:
    name: security (pen-test suite, static analysis, dependencies, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true
          activate-environment: true
      - name: Install pinned dependencies
        run: uv pip install -r requirements.txt
      - name: Adversarial suites (OWASP mapping, red-team findings, hostile input, prompt injection, audit tampering)
        env:
          FEATHERLESS_API_KEY: ''
        run: |
          python -m unittest -v tests.test_security_owasp tests.test_redteam_findings tests.test_garbled_output_guard \
            tests.test_stress_ingest tests.test_stress_ai_boundary tests.test_stress_review_page \
            tests.test_injection_owasp_llm01 tests.test_fuzz_injection tests.test_timestamp_anchor
      - name: Static analysis (bandit, medium severity and above fails the build)
        run: |
          uv pip install bandit==1.9.4
          bandit -q -r src scripts -ll
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: |
          # pip-audit's own virtualenv step (ensurepip) fails on uv-managed Python, so resolve the full
          # transitive set with uv and audit that list without letting pip-audit build an environment.
          uv pip compile requirements.txt -o "$RUNNER_TEMP/locked.txt" -q
          uvx pip-audit -r "$RUNNER_TEMP/locked.txt" --no-deps --disable-pip
      - name: Secret scan of the whole history (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
