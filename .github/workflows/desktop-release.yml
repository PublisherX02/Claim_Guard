# Builds ClaimGuard.exe (the Windows desktop app) on a Windows runner and publishes it as a GitHub release.
# Start it by pushing a tag named desktop-vX.Y.Z, or by hand from the Actions tab (Run workflow).
# It needs no secret: it uses the repository's own GITHUB_TOKEN to create the release.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (for example desktop-v1.3.0)'
        required: true
        default: 'desktop-v1.3.0'

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows-exe:
    name: build ClaimGuard.exe
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain named in rust/rust-toolchain.toml (Windows GNU)
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the server (cg.exe)
        shell: pwsh
        working-directory: rust
        run: cargo build --release -p cg-cli --locked
      - uses: astral-sh/setup-uv@v5
      - name: Build ClaimGuard.exe (desktop/build_windows.ps1)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File desktop\build_windows.ps1
      - name: Size and SHA-256
        shell: pwsh
        run: |
          $f = Get-Item desktop\dist\ClaimGuard.exe
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          "$h  ClaimGuard.exe" | Out-File -Encoding ascii desktop\dist\ClaimGuard.exe.sha256
          "ClaimGuard.exe: $($f.Length) bytes, SHA-256 $h, tag $env:RELEASE_TAG, commit $env:GITHUB_SHA" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ClaimGuard-exe
          path: |
            desktop/dist/ClaimGuard.exe
            desktop/dist/ClaimGuard.exe.sha256
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows desktop app built on GitHub from commit $env:GITHUB_SHA. Not code-signed: Windows warns on first run. SHA-256 is in ClaimGuard.exe.sha256 and in docs/43_Desktop_App_Release.md."
          gh release create $env:RELEASE_TAG desktop\dist\ClaimGuard.exe desktop\dist\ClaimGuard.exe.sha256 --target $env:GITHUB_SHA --title $env:RELEASE_TAG --notes $notes
