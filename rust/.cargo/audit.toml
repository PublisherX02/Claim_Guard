# Known advisories that were looked at and judged NOT reachable from ClaimGuard. Every entry says why; anything new still fails the audit.
# Re-check each one whenever yara-x or the timestamp crates are upgraded: `cargo audit` must then pass without this list.
# (The four wasmtime entries kept here before were dropped when yara-x 1.22.1 moved to wasmtime 48, which fixes them.)
[advisories]
ignore = [
    # rsa 0.9.10 (cg-timestamp) and rsa 0.10.0-rc.19 (inside yara-x): Marvin timing attack on PRIVATE-key operations, no fix released.
    # ClaimGuard only VERIFIES signatures with public keys (the RFC 3161 timestamp check, and inside yara-x for its optional crypto module);
    # it holds and uses no RSA private key.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5.5, pulled in by p256/p384 0.13 in cg-timestamp: operations meant to be constant-time are not, which can leak a
    # SECRET operand through timing. cg-timestamp only verifies ECDSA signatures on timestamp tokens with the authority's PUBLIC key, so
    # there is no secret to leak. The fix (crypto-bigint 0.7) needs p256/p384 0.14, which moves der, x509-cert, cms and signature up a
    # major version together; do that as its own change and drop this entry then.
    "RUSTSEC-2026-0387",
]
