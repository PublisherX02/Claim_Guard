[workspace]
resolver = "2"
members = ["crates/cg-core", "crates/cg-engine", "crates/cg-audit", "crates/cg-access", "crates/cg-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
bigdecimal = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
