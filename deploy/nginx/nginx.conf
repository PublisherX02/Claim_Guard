# ClaimGuard behind nginx: the same jobs the Caddyfile does, written for nginx (docs/54). Mount this file as /etc/nginx/nginx.conf, the certificate and
# key as /etc/nginx/tls/cert.pem and key.pem. The API listens on api:8443 and must be started with --behind-proxy; only this proxy may reach that port.
#
# What each part is for:
#   - TLS ends here; port 80 only redirects.
#   - Slow or oversized requests are cut off here, before they reach the application (slowloris, giant headers, giant bodies).
#   - Body limits per path: 100 KB everywhere, 4 MB to submit claims (a batch of up to 1,000), 17 MB to import a file.
#   - The live-update stream is never buffered or compressed.
#   - The client address the application sees is the one nginx saw: whatever the client put in X-Forwarded-For is thrown away.
#   - Sign-in attempts and general traffic are rate limited per client address, as a first layer in front of the application's own throttle.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;                      # no version number (the "Server: nginx" word itself stays; removing it needs a module)

    # ---- slow and oversized requests ----
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 120s;
    large_client_header_buffers 4 8k;       # a header line is at most 8 KB, the whole header block at most 32 KB (the Caddyfile allows 16 KB)
    client_max_body_size 100k;              # no ordinary request the application accepts is larger; the exceptions are set per location below
    # the whole body is read here before it is passed on (the default): a slow sender ties up this proxy, never the application

    # ---- rate limits ----
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # ---- what is compressed (never the event stream: a compressor can hold small messages back) ----
    gzip on;
    gzip_types application/json text/css application/javascript text/javascript text/plain;
    gzip_min_length 512;

    upstream api {
        server api:8443;
        keepalive 32;                       # reuse connections to the application instead of opening one per request
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # one set of headers for every proxied location
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;     # overwrite, never append: the application takes the LAST hop as the client
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # clean JSON answers for the failures nginx produces itself (the application's own errors are JSON too)
        error_page 413 = @too_big;
        error_page 429 = @slow_down;
        error_page 502 503 504 = @unavailable;
        location @too_big { default_type application/json; return 413 '{"error":"payload_too_large"}'; }
        location @slow_down { default_type application/json; add_header Retry-After 60 always; return 429 '{"error":"too_many_requests"}'; }
        location @unavailable { default_type application/json; return 503 '{"error":"unavailable"}'; }

        # live updates (server-sent events): passed straight through, flushed at once, never compressed
        location = /api/v1/work/events {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 1h;           # the server sends a message every few seconds; this only bounds a dead connection
            limit_req zone=api burst=60 nodelay;
        }

        # submitting claims: one submission is one batch of up to 1,000 claims (about 1.5 KB each); taking in a batch of 1,000 takes tens of seconds
        location = /api/v1/queue/submit {
            client_max_body_size 4m;
            proxy_read_timeout 120s;
            proxy_pass http://api;
            limit_req zone=api burst=60 nodelay;
        }

        # importing files: a scanned page or a FHIR export (the application checks the real size and kind)
        location ~ ^/api/v1/queue/import/(file|csv)$ {
            client_max_body_size 17m;
            proxy_pass http://api;
            limit_req zone=api burst=60 nodelay;
        }

        # sign-in: ten a minute per address after a burst of five. The application also throttles per badge and per address; this is the outer wall.
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api;
        }
    }
}
