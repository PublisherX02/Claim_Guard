# ClaimGuard (Rust build) on one machine: TLS proxy, API + console, queue worker, MongoDB, Redis (and, optionally, a local model).
# Only the proxy publishes ports (80 and 443). The API, MongoDB and Redis are reachable on the private network only.
#
#   cp deploy/env.production.example .env      # then fill it in, or run deploy/install.sh which does it for you
#   docker compose -f deploy/rust/compose.yml --env-file .env up -d --build
#   docker compose -f deploy/rust/compose.yml --env-file .env --profile ai-fetch run --rm vllm-fetch   # once: download the model weights
#   docker compose -f deploy/rust/compose.yml --env-file .env --profile ai up -d     # also start the local model server (vLLM)
name: claimguard

x-app: &app
  build: { context: ../.., dockerfile: deploy/rust/Dockerfile }
  image: claimguard-rs:latest
  restart: unless-stopped
  environment: &appenv
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY in .env}
    DATA_KEY: ${DATA_KEY:-}          # empty: the data key is derived from FERNET_KEY (then FERNET_KEY can never change); set it to keep the two apart
    DATA_KEY_PREVIOUS: ${DATA_KEY_PREVIOUS:-}   # older data keys, comma separated: keeps audit-log rows written under them readable after `cg rotate-key`
    DUAL_CONTROL: ${DUAL_CONTROL:-true}          # resetting an authenticator and changing administrators need a second administrator
    APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-86400}
    AUDIT_ANCHOR_KEY: ${AUDIT_ANCHOR_KEY:?set AUDIT_ANCHOR_KEY in .env}
    PII_KEY: ${PII_KEY:?set PII_KEY in .env}
    MONGO_URI: mongodb://${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongo:27017/?authSource=admin
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0   # the worker's message broker (Redis Streams); empty = claims are processed inline
    CG_WORKER_CONCURRENCY: ${CG_WORKER_CONCURRENCY:-4}   # claims processed at once = the most the model is ever asked at once; the vLLM server's --max-num-seqs follows it
    CG_BROKER_MIN_IDLE_SECONDS: ${CG_BROKER_MIN_IDLE_SECONDS:-}   # empty: the explanation ceiling plus 30 s before another consumer takes a message over
    QUEUE_AI_PROVIDER: ${QUEUE_AI_PROVIDER:-}
    QUEUE_AI_TWO_PASS: ${QUEUE_AI_TWO_PASS:-}
    VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000}
    VLLM_MODEL: ${VLLM_MODEL:-google/gemma-3-4b-it}   # the name the server serves the model under (the Hugging Face repository id)
    VLLM_API_KEY: ${VLLM_API_KEY:-}                   # the key the server was started with
    FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:-}
    TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-*}
    # audit protection (docs/39): a second, append-only copy of both logs on its own volume (only the worker mounts it), and an optional
    # RFC 3161 timestamp authority; the API reads these two only to know which checks the health panel should expect
    AUDIT_MIRROR_DIR: ${AUDIT_MIRROR_DIR:-/mirror}
    TSA_URL: ${TSA_URL:-}
    TSA_CA_FILE: ${TSA_CA_FILE:-}
    # signed ledger (docs/45): the API and the worker know the PUBLIC key; the signing seed is given to the worker only (below)
    LEDGER_PUBLIC_KEY: ${LEDGER_PUBLIC_KEY:-}
    LEDGER_CHECKPOINT_SECONDS: ${LEDGER_CHECKPOINT_SECONDS:-300}
    # importing claims from documents: the reader's address (empty: PDFs and pictures are refused; JSON, FHIR and CSV still work)
    DOCUMENT_READER_URL: ${DOCUMENT_READER_URL:-}
    DOCUMENT_READER_TOKEN: ${DOCUMENT_READER_TOKEN:-}
    DOCUMENT_READER_ENGINE: ${DOCUMENT_READER_ENGINE:-auto}
    DOCUMENT_READER_LANGS: ${DOCUMENT_READER_LANGS:-eng}
    # "Ask the rulebook" by meaning (docs/52): the embedding service's address (empty: the keyword search answers; it also answers whenever this service is down)
    EMBEDDER_URL: ${EMBEDDER_URL:-}
    EMBEDDER_TOKEN: ${EMBEDDER_TOKEN:-}
    EMBEDDER_THRESHOLD: ${EMBEDDER_THRESHOLD:-0.485}
    EMBEDDER_TIMEOUT: ${EMBEDDER_TIMEOUT:-60}       # bge-m3 on a CPU needs seconds per batch of passages
  volumes:
    - claimguard_data:/data
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 768m         # measured at about 70 MB; a runaway cannot take the machine with it
  pids_limit: 256
  cpus: 2.0

services:
  proxy:
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    networks: [edge]
    mem_limit: 128m
    pids_limit: 128
    ports: ["80:80", "443:443"]
    environment:
      CG_SITE: ${CG_SITE:?set CG_SITE in .env (a domain name, or an address for an internal certificate)}
    volumes:
      - ../${CADDYFILE:-Caddyfile.internal}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    <<: *app
    networks: [edge, data, reader, search]
    command: ["cg", "serve", "--host", "0.0.0.0", "--port", "8443", "--queue", "--behind-proxy"]
    expose: ["8443"]

  worker:
    <<: *app
    environment:
      <<: *appenv
      LEDGER_SIGNING_KEY: ${LEDGER_SIGNING_KEY:-}   # the signing seed: this process only, never the API
    networks: [data, egress]       # egress only for the optional external timestamp authority (TSA_URL)
    # The relay, deal, expire and reconcile loops. Exactly one instance: the loops must not be duplicated.
    command: ["cg", "worker"]
    volumes:
      - claimguard_data:/data
      - audit_mirror:/mirror
    healthcheck:
      test: ["CMD", "cg", "health", "--file", "/tmp/cg_worker_alive", "--max-age", "30"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:7@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # Without a cap MongoDB sizes its cache at half of the machine's RAM minus 1 GB (about 5.5 GB on a 12 GB server) and leaves little for the
    # rest. 1 GB holds the recently used claims comfortably; older ones are read from disk. Raise MONGO_CACHE_GB on a bigger machine.
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    mem_limit: 2g              # the cache plus connections and indexes; about 0.5 GB was measured when nearly empty
    pids_limit: 512
    networks: [data]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # The worker's message broker (Redis Streams). The truth lives in MongoDB (the outbox and the claim state); Redis only carries "run this
    # claim" messages. The append-only file keeps them over a restart (at most about one second of messages can be lost in a crash), and the
    # worker re-publishes claims whose message was lost anyway (docs/38 section 7).
    command: ["sh", "-c", "exec redis-server --save \"\" --appendonly yes --appendfsync everysec --maxmemory 200mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    # the stream holds only unfinished work (about 150 bytes a message), so 200 MB is a backlog of over a million; noeviction means that at the
    # limit a publish fails and the claim waits safely in the outbox, instead of Redis silently dropping messages
    mem_limit: 320m
    pids_limit: 64
    networks: [data]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  reader:                       # optional, the document reader (PDF pages, scans, photos); start with --profile documents
    profiles: ["documents"]
    build: { context: ../.., dockerfile: deploy/ocr/Dockerfile }
    image: claimguard-reader:latest
    restart: unless-stopped
    environment:
      OCR_TOKEN: ${DOCUMENT_READER_TOKEN:?set DOCUMENT_READER_TOKEN in .env}
      OCR_ENGINE: ${DOCUMENT_READER_ENGINE:-auto}
      OCR_LANGS: ${DOCUMENT_READER_LANGS:-eng}
      VLM_BASE_URL: ${VLM_BASE_URL:-}        # an OpenAI-compatible vision model on the private network, e.g. http://vllm-vision:8000/v1
      VLM_MODEL: ${VLM_MODEL:-}              # the name that server serves it under; empty: Tesseract only
      VLM_API_KEY: ${VLLM_API_KEY:-}         # the same key as the model servers
    networks: [reader]                       # a network with no route out: shared only with the API and the model server
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    pids_limit: 128
    cpus: 2.0

  embed:                        # optional, "Ask the rulebook" by meaning (docs/52): BAAI/bge-m3 on CPU (docs/55), weights baked in (about 2.3 GB); start with --profile search
    profiles: ["search"]
    build: { context: ../.., dockerfile: deploy/embed/Dockerfile }
    image: claimguard-embed:latest
    restart: unless-stopped
    environment:
      EMBED_TOKEN: ${EMBEDDER_TOKEN:?set EMBEDDER_TOKEN in .env}
    networks: [search]                       # a network with no route out: shared only with the API
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 4g              # bge-m3 weights in fp32 are about 2.3 GB; the measured resident size is in docs/55
    pids_limit: 128
    cpus: 2.0

  vllm:                         # on-premises model for the explanation drafts: vLLM, OpenAI-compatible API on port 8000; start with --profile ai
    profiles: ["ai"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0-cu129@sha256:ff29e51a9457f191deb332b96fa6440584fa941aa2a548449b604e2b1e5e1eeb}   # pin a release; check the driver note in docs/40 section 12 before changing it
    restart: unless-stopped
    networks: [data, reader]
    volumes: [model_cache:/models]
    mem_limit: 8g              # host memory only; the weights and the cache sit in the graphics card's memory
    pids_limit: 512
    shm_size: 2g
    tmpfs: ["/tmp:size=2g"]    # compile and graph caches are rebuilt at every start; nothing persists here
    environment:
      HOME: /tmp
      VLLM_CACHE_ROOT: /tmp/vllm-cache
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"      # the weights were fetched once by vllm-fetch; this container has no route out and never asks the internet
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY in .env (install.sh generates one)}
      VLLM_MODEL: ${VLLM_MODEL:-google/gemma-3-4b-it}
      VLLM_MAX_LEN: ${VLLM_MAX_LEN:-2048}           # an explanation prompt is about 600 tokens and the answer at most 500
      VLLM_GPU_UTIL: ${VLLM_GPU_UTIL:-0.55}         # the share of the card's memory this server may take (the vision server below takes its own)
      VLLM_MAX_SEQS: ${CG_WORKER_CONCURRENCY:-4}    # sequences decoded together: the same number as the worker's pool
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:---quantization fp8}   # weight-only FP8 (an RTX 3080 is Ampere): halves the weights to fit the 10 GB card; set it to a space for a card with room
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec vllm serve "$$VLLM_MODEL" --served-model-name "$$VLLM_MODEL" --api-key "$$VLLM_API_KEY" --host 0.0.0.0 --port 8000 --max-model-len "$$VLLM_MAX_LEN" --max-num-seqs "$$VLLM_MAX_SEQS" --gpu-memory-utilization "$$VLLM_GPU_UTIL" $$VLLM_EXTRA_ARGS']
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 600s       # loading the weights and capturing the graphs takes minutes

  vllm-vision:                  # optional, the document reader's vision model: vLLM serves ONE model per process, so it has its own; start with --profile vision
    profiles: ["vision"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0-cu129@sha256:ff29e51a9457f191deb332b96fa6440584fa941aa2a548449b604e2b1e5e1eeb}
    restart: unless-stopped
    networks: [data, reader]
    volumes: [model_cache:/models]
    mem_limit: 8g
    pids_limit: 512
    shm_size: 2g
    tmpfs: ["/tmp:size=2g"]
    environment:
      HOME: /tmp
      VLLM_CACHE_ROOT: /tmp/vllm-cache
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY in .env (install.sh generates one)}
      VLLM_VLM_MODEL: ${VLLM_VLM_MODEL:?set VLLM_VLM_MODEL in .env (the Hugging Face repository of the vision model)}
      VLLM_VLM_MAX_LEN: ${VLLM_VLM_MAX_LEN:-4096}
      VLLM_VLM_GPU_UTIL: ${VLLM_VLM_GPU_UTIL:-0.30}   # 0.55 + 0.30 leaves 15% of the card free; the two must not add up to more than 1
      VLLM_VLM_EXTRA_ARGS: ${VLLM_VLM_EXTRA_ARGS:- }
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec vllm serve "$$VLLM_VLM_MODEL" --served-model-name "$$VLLM_VLM_MODEL" --api-key "$$VLLM_API_KEY" --host 0.0.0.0 --port 8000 --max-model-len "$$VLLM_VLM_MAX_LEN" --max-num-seqs 2 --gpu-memory-utilization "$$VLLM_VLM_GPU_UTIL" $$VLLM_VLM_EXTRA_ARGS']
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 600s

  vllm-fetch:                   # one-shot: downloads the model weights into the model volume. The ONLY container here with a route to the internet; install.sh runs it
    profiles: ["ai-fetch"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0-cu129@sha256:ff29e51a9457f191deb332b96fa6440584fa941aa2a548449b604e2b1e5e1eeb}
    restart: "no"
    networks: [egress]
    volumes: [model_cache:/models, ./fetch_model.py:/fetch_model.py:ro]
    mem_limit: 1g
    pids_limit: 128
    environment:
      HOME: /tmp
      HF_HOME: /models/hf
      HF_TOKEN: ${HF_TOKEN:-}                 # for a gated model (Gemma): a read token of an account that accepted the licence
      VLLM_MODEL_REVISION: ${VLLM_MODEL_REVISION:-}   # optional commit hash that pins the explanation model
      FETCH_MODELS: ${CG_FETCH_MODELS:-google/gemma-3-4b-it}
    entrypoint: ["python3", "/fetch_model.py"]

# The proxy is the only thing on the edge with the outside world; the database, the cache and the model are on a network with no route out
# (internal), so a compromised proxy cannot reach MongoDB and a compromised database cannot call out.
networks:
  edge: {}
  data:
    internal: true
  reader:
    internal: true
  search:
    internal: true
  egress: {}

volumes:
  audit_mirror:
  claimguard_data:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
  model_cache:
